<!DOCTYPE html>
<html>
<head>
    <title>Verify OTP - CryptGo</title>
    <link rel="stylesheet" href="signup.css">
</head>
<body>
    <div class="auth-card">
        <h1>Verify Identity</h1>
        <p class="subtitle">Enter the 6-digit code sent to your email</p>
        
        <form id="otpForm">
            <input type="text" id="otp" placeholder="000000" maxlength="6" 
                   style="text-align: center; font-size: 1.5rem; letter-spacing: 0.5rem;" required>
            <button type="submit">Verify & Unlock</button>
        </form>

        <p id="message"></p>
    </div>
    <script src="otp.js"></script>
</body>
</html>
